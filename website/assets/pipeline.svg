<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="285" viewBox="0 0 1120 285" role="img" aria-labelledby="title desc">
<title id="title">MRBench reconstruction and evaluation pipeline</title><desc id="desc">Canonical dataset samples are physically sampled and passed to separate model adapters. Saved results feed a common evaluator and a static interactive dashboard.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#788698"/></marker></defs>
<rect width="1120" height="285" rx="20" fill="#f3f6f9"/>
<g font-family="Arial,sans-serif" font-size="17" fill="#203149" text-anchor="middle">
<rect x="22" y="65" width="180" height="130" rx="12" fill="white" stroke="#c4cfdd"/><text x="112" y="98" font-weight="bold">Dataset</text><text x="112" y="130" font-size="14">Complex k-space</text><text x="112" y="153" font-size="14">Maps + metadata</text><text x="112" y="176" font-size="13">Reference for evaluation</text>
<rect x="228" y="65" width="190" height="130" rx="12" fill="#e3f1ec" stroke="#aecfc1"/><text x="323" y="98" font-weight="bold">Physical sampling</text><text x="323" y="130" font-size="14">Explicit mask + actual R</text><text x="323" y="153" font-size="14">ACS and source recorded</text><text x="323" y="176" font-size="13">Same acquisition per model</text>
<rect x="448" y="38" width="195" height="54" rx="10" fill="#e1eaf6"/><text x="545" y="71">SDUM</text><rect x="448" y="103" width="195" height="54" rx="10" fill="#e1eaf6"/><text x="545" y="136">CardioMM</text><rect x="448" y="168" width="195" height="54" rx="10" fill="#e1eaf6"/><text x="545" y="201">RAM</text>
<rect x="678" y="65" width="195" height="130" rx="12" fill="white" stroke="#c4cfdd"/><text x="776" y="98" font-weight="bold">Saved reconstruction</text><text x="776" y="130" font-size="14">Candidate + provenance</text><text x="776" y="153" font-size="14">Versioned evaluation</text><text x="776" y="176" font-size="13">Frame → subject → cohort</text>
<rect x="900" y="65" width="195" height="130" rx="12" fill="#e3f1ec" stroke="#aecfc1"/><text x="998" y="98" font-weight="bold">Interactive results</text><text x="998" y="130" font-size="14">Metrics + paired statistics</text><text x="998" y="153" font-size="14">Future qualitative panels</text><text x="998" y="176" font-size="13">Static GitHub Pages site</text>
<text x="545" y="260" font-size="14" fill="#5c6c7e">A shared interface, with each model's released preprocessing and runtime preserved</text></g>
